[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linago"
version = "0.4.0"
description = "Lightweight OCR + AI translation overlay for Hyprland / Wayland"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]
keywords = ["ocr", "translation", "wayland", "hyprland", "tesseract", "ollama"]
classifiers = [
    "Environment :: Wayland",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.scripts]
linago = "linago.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["linago"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = [
    "linago/lang.py",
    "linago/placement.py",
    "linago/config.py",
    "linago/backends.py",
    "linago/ocr.py",
    "linago/cli.py",
    "linago/i18n.py",
    "linago/daemon.py",
    "tests",
]
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["gi.*", "gi.repository.*", "Gtk4LayerShell.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["linago.ui"]
follow_imports = "skip"
ignore_missing_imports = true
