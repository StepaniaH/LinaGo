# Active translation backend. Switch with:
#   - edit provider = "…" below
#   - env TRANSLATE_PROVIDER=…
#   - CLI  --provider …
#   - the popup provider dropdown
#
# API keys live in config/secrets.toml (gitignored) or the env vars
# named by each provider's api_key_env.

[app]
provider = "ollama"
# UI language: a language code like "zh_CN". Unset follows LINAGO_LANG
# / the system locale, falling back to English.

# ── local ────────────────────────────────────────────────────────────────────
[providers.ollama]
type = "ollama"
label = "Ollama"
# Host only — /api/generate is appended by the client.
base_url = "http://127.0.0.1:11434"
model = "qwen2.5:3b"

# ── BYOK (OpenAI-compatible chat completions) ────────────────────────────────
# Uncomment / copy blocks for any OpenAI-compatible endpoint
# (OpenAI, DeepSeek, Groq, OpenRouter, local llama.cpp server, …).
#
# Per-provider request options: timeout (seconds), temperature,
# max_tokens. Unset keys fall back to built-in defaults.

[providers.openai]
type = "openai"
label = "OpenAI"
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"

[providers.deepseek]
type = "openai"
label = "DeepSeek"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"

# ── OCR engine ───────────────────────────────────────────────────────────────
# engine: "tesseract" (offline, fast) or "vision" (multimodal model).
# Vision mode sends the screenshot to the provider named below, which
# copes with small text, dark themes, and stylized fonts that trip
# tesseract up. Override per run with --ocr-engine / TRANSLATE_OCR_ENGINE.
#
# [ocr]
# engine = "tesseract"
# tesseract_langs = "chi_sim+eng"
# provider = "ollama"          # used when engine = "vision"

# ── custom actions ───────────────────────────────────────────────────────────
# Named prompt templates shown in the popup's action dropdown and usable
# as `linago --action <name>`. {source}/{target} become language names;
# {text} receives the text (appended when absent). Uncomment to enable:
#
# [actions]
# explain = "Explain the terminology and context of this {source} text:"
# polish = "Polish the following text:\n\n{text}"
#
# Set a default for the dropdown with `action = "explain"` under [app].

# ── compare panes ────────────────────────────────────────────────────────────
# List up to four provider names; the popup then renders one streaming
# pane per entry instead of a single translation. Empty keeps the
# default single pane.
#
# [compare]
# providers = ["openai", "deepseek"]

# ── appearance ───────────────────────────────────────────────────────────────
# Presets render config/style.css from linago/style.css.template;
# prefer editing these values (or the web console) over hand-editing
# the stylesheet.
#
# [appearance]
# preset = "dark"             # dark | midnight | paper
# accent = ""                 # section-label color override
# bg_alpha = 0.94             # 0.3 – 1.0
# font_scale = 1.0            # 0.7 – 1.6

# ── history / speech / memory ────────────────────────────────────────────────
# [history]
# enabled = false             # stop recording translations locally
#
# [tts]
# provider = "openai"         # speak button; needs an OpenAI-compatible TTS
#
# [memory]
# enabled = true              # remember source languages per app class

